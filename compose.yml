services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: efi
      POSTGRES_USER: efi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efi -d efi"]
      interval: 5s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://efi:${POSTGRES_PASSWORD}@db:5432/efi
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_data:
